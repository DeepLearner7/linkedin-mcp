[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for LinkedIn"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Saurabh" }
]
dependencies = [
    "mcp>=1.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
